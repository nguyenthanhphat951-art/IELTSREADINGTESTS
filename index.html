<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Test Portal</title>
    <!-- Use Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #000000;
            --hover-color: #333333;
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #555555;
            --border-color: #e5e5e5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 60px 40px 80px 40px; 
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 36px; 
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header p {
            margin: 12px 0 0 0;
            font-size: 18px;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px; 
            margin: -40px auto 60px auto;
            padding: 0 40px;
        }

        .test-card {
            background-color: var(--card-bg);
            border-radius: 8px; 
            padding: 30px 40px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .test-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-color);
        }

        .card-content {
            flex: 1;
            padding-right: 50px;
        }

        .card-header {
            display: block;
            margin-bottom: 12px;
        }

        .test-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
        }

        .test-desc {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.8;
        }

        .test-desc strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-start {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: var(--primary-color);
            padding: 14px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid var(--primary-color);
            transition: all 0.2s ease;
            min-width: 180px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .btn-start:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-start span {
            margin-left: 8px;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .btn-start:hover span {
            transform: translateX(5px);
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 40px;
            border-top: 1px solid var(--border-color);
            max-width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>IELTS READING TEST</h1>
    </header>

    <main class="container">
        
        <!-- FULL TEST 1 -->
        <article class="test-card">
            <div class="card-content">
                <div class="card-header">
                    <h2 class="test-title">CAMBRIDGE 20 TEST 1</h2>
                </div>
            </div>
            <!-- Gắn link vào file test-1.html -->
            <a href="test-1.html" class="btn-start">Start Test <span>&rarr;</span></a>
        </article>

        <!-- FULL TEST 2 -->
        <article class="test-card">
            <div class="card-content">
                <div class="card-header">
                    <h2 class="test-title">CAMBRIDGE 20 TEST 2</h2>
                </div>
            </div>
            <!-- Gắn link vào file test-2.html -->
            <a href="test-2.html" class="btn-start">Start Test <span>&rarr;</span></a>
        </article>

        <!-- FULL TEST 3 -->
        <article class="test-card">
            <div class="card-content">
                <div class="card-header">
                    <h2 class="test-title">CAMBRIDGE 20 TEST 3</h2>
                </div>
            </div>
            <!-- Gắn link vào file test-3.html -->
            <a href="test-3.html" class="btn-start">Start Test <span>&rarr;</span></a>
        </article>

        <!-- FULL TEST 4 -->
        <article class="test-card">
            <div class="card-content">
                <div class="card-header">
                    <h2 class="test-title">CAMBRIDGE 20 TEST 4</h2>
                </div>
            </div>
            <!-- Gắn link vào file test-4.html -->
            <a href="test-4.html" class="btn-start">Start Test <span>&rarr;</span></a>
        </article>

    </main>

    <footer class="footer">
        &copy; 2026 Developed for IELTS Tutor Phat. All rights reserved.
    </footer>

</body>
</html>
